name: Mutation

# Pest's native mutation testing (Infection does not support Pest suites).
# Mutation runs are slow, so this is scheduled/manual rather than per-push.
# The suite holds covered-MSI at ~87% (>= the 85% gate), so this job is a hard
# gate: a regression below 85% fails the run.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutate:
    name: Mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: pcov

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Mutation testing (target MSI >= 85)
        run: vendor/bin/pest --mutate --everything --covered-only --min=85
