# GitGuardian scanning policy for laranail/env-kit.
#
# This package's whole subject is environment variables, so its tests necessarily
# set things named *_PASSWORD, *_SECRET and *_TOKEN. Those values are assertions,
# not credentials: the redaction tests prove the value never reaches the audit log
# or a listing, which requires a distinctive value to search for.
#
# The paths below are ignored for that reason and no other. They are named
# individually rather than ignoring tests/** on purpose -- a real credential
# committed to some other test must still be caught, and a blanket exclusion is
# how that stops happening.
#
# The fixture values were also renamed to read as canaries rather than passwords
# (`redaction-canary-not-a-secret`). That stops future commits tripping the scan
# at source; this file is what covers the commits already in history, which a
# rename cannot reach.

version: 2

secret:
  ignored-paths:
    # Asserts the raw value is absent from the JSON-lines audit record.
    - tests/Feature/AuditTest.php
    # Asserts protected_keys / hidden_keys policy against *_PASSWORD keys.
    - tests/Feature/KeyPolicyTest.php
    # Drives the same policy through the CLI surface.
    - tests/Feature/CliCommandsTest.php

  # A fixture that is genuinely a placeholder should be readable as one. If a
  # finding here is ever anything other than that, fix the code -- do not extend
  # this list.
  show-secrets: false
